<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>meljs Variant Comparison</title>
  <style>
    :root {
      --bg: #f7f7f8;
      --panel: #ffffff;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 12% 0%, #e6fffb 0%, rgba(230, 255, 251, 0) 30%),
        radial-gradient(circle at 100% 0%, #eef2ff 0%, rgba(238, 242, 255, 0) 25%),
        var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Avenir Next", "Trebuchet MS", sans-serif;
    }
    .wrap {
      max-width: 1220px;
      margin: 0 auto;
      padding: 16px;
    }
    .hero {
      background: linear-gradient(130deg, #0f766e 0%, #1d4ed8 100%);
      color: #fff;
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 12px;
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.15);
    }
    .hero h1 { margin: 0 0 6px; font-size: 24px; }
    .hero p { margin: 0; opacity: 0.9; }
    .panel {
      background: var(--panel);
      border: 1px solid rgba(31, 41, 55, 0.08);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.06);
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 8px;
      align-items: end;
    }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 12px; color: var(--muted); font-weight: 600; }
    input, button {
      height: 34px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      padding: 0 10px;
      font-size: 13px;
      background: #fff;
      color: var(--ink);
    }
    button {
      border: 0;
      color: #fff;
      background: #0f766e;
      cursor: pointer;
      font-weight: 600;
    }
    button.secondary { background: #1d4ed8; }
    button.ghost { background: #fff; color: var(--ink); border: 1px solid #d1d5db; }
    .meta { margin-top: 8px; color: var(--muted); font-size: 13px; }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; margin: 6px 0 8px; font-size: 13px; }
    .dot { width: 10px; height: 10px; border-radius: 999px; display: inline-block; margin-right: 6px; }
    canvas { width: 100%; height: 290px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid #eceff1; padding: 7px 6px; text-align: right; white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    th { color: #374151; font-size: 12px; text-transform: uppercase; letter-spacing: 0.02em; }
    .best { font-weight: 700; color: #065f46; }
    @media (max-width: 980px) {
      .controls { grid-template-columns: 1fr 1fr; }
      canvas { height: 250px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>meljs Variant Benchmark Charts</h1>
      <p>Duration vs p50 latency, RTFx, and speedup. Use 7–14s preset for streaming-focused selection.</p>
    </section>

    <section class="panel">
      <div class="controls">
        <div class="field" style="grid-column: span 2;">
          <label for="minSec">Min Sec</label>
          <input id="minSec" type="number" step="0.1" value="0" />
        </div>
        <div class="field" style="grid-column: span 2;">
          <label for="maxSec">Max Sec</label>
          <input id="maxSec" type="number" step="0.1" value="200" />
        </div>
        <div class="field" style="grid-column: span 2;">
          <button id="btn714" class="secondary">Set 7–14s</button>
        </div>
        <div class="field" style="grid-column: span 2;">
          <button id="btnReset" class="ghost">Reset Range</button>
        </div>
        <div class="field" style="grid-column: span 2;">
          <button id="btnLoadLatest">Load Tracked JSONs</button>
        </div>
        <div class="field" style="grid-column: span 4;">
          <label for="files">Load JSON File(s)</label>
          <input id="files" type="file" accept=".json,application/json" multiple />
        </div>
      </div>
      <div id="meta" class="meta"></div>
    </section>

    <section class="panel">
      <div id="legend1" class="legend"></div>
      <canvas id="c1" width="1200" height="290"></canvas>
    </section>

    <section class="panel">
      <div id="legend2" class="legend"></div>
      <canvas id="c2" width="1200" height="290"></canvas>
    </section>

    <section class="panel">
      <div id="legend3" class="legend"></div>
      <canvas id="c3" width="1200" height="290"></canvas>
    </section>

    <section class="panel">
      <h3 style="margin: 0 0 8px;">Range Summary</h3>
      <table id="summary"></table>
    </section>

    <section class="panel">
      <h3 style="margin: 0 0 8px;">Per Duration</h3>
      <table id="detail"></table>
    </section>
  </div>

  <script>
    const DEFAULT_LATEST_PATH = "../tmp/meljs-variant-benchmark-latest.json";
    const DEFAULT_MANIFEST_PATH = "../tmp/meljs-variant-benchmark-manifest.json";
    const COLORS = ["#0f766e", "#be123c", "#1d4ed8", "#7c3aed", "#ea580c", "#2563eb"];

    const state = {
      reports: [],
      aggregate: new Map(),
      variants: [],
      durations: [],
      colors: new Map(),
    };

    function median(a) {
      if (!a.length) return null;
      const s = [...a].sort((x, y) => x - y);
      const m = Math.floor(s.length / 2);
      return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
    }

    function avg(a) {
      if (!a.length) return null;
      return a.reduce((x, y) => x + y, 0) / a.length;
    }

    function gmean(a) {
      const v = a.filter((x) => x > 0);
      if (!v.length) return null;
      return Math.exp(v.reduce((x, y) => x + Math.log(y), 0) / v.length);
    }

    function fms(v) { return v == null ? "-" : v.toFixed(3); }
    function fx(v) { return v == null ? "-" : v.toFixed(3) + "x"; }
    function fsec(v) { return Number(v).toFixed(3).replace(/\.000$/, ""); }

    function normalize(reports) {
      const aggregate = new Map();
      const variantSet = new Set();
      const durationSet = new Set();

      for (const report of reports) {
        if (!report || !Array.isArray(report.bySplit)) continue;
        for (const row of report.bySplit) {
          const d = Number(row?.split?.actualSec);
          if (!Number.isFinite(d) || d <= 0) continue;
          durationSet.add(d);
          if (!aggregate.has(d)) aggregate.set(d, new Map());
          const bucket = aggregate.get(d);
          for (const [variant, vrec] of Object.entries(row.variants || {})) {
            variantSet.add(variant);
            if (!bucket.has(variant)) {
              bucket.set(variant, { p50: [], p90: [], rtfx: [], speed: [] });
            }
            const slot = bucket.get(variant);
            const p50 = Number(vrec?.timing?.p50Ms);
            const p90 = Number(vrec?.timing?.p90Ms);
            const speed = Number(vrec?.timing?.speedupVsCurrentP50);
            if (Number.isFinite(p50) && p50 > 0) {
              slot.p50.push(p50);
              slot.rtfx.push(d / (p50 / 1000));
            }
            if (Number.isFinite(p90) && p90 > 0) slot.p90.push(p90);
            if (Number.isFinite(speed) && speed > 0) slot.speed.push(speed);
          }
        }
      }

      state.aggregate = aggregate;
      state.variants = [...variantSet].sort();
      state.durations = [...durationSet].sort((a, b) => a - b);
      state.variants.forEach((v, i) => {
        if (!state.colors.has(v)) state.colors.set(v, COLORS[i % COLORS.length]);
      });
    }

    function filteredDurations() {
      const min = Number(document.getElementById("minSec").value);
      const max = Number(document.getElementById("maxSec").value);
      return state.durations.filter((d) => d >= (Number.isFinite(min) ? min : 0) && d <= (Number.isFinite(max) ? max : Number.POSITIVE_INFINITY));
    }

    function series(metric, durations) {
      return state.variants.map((v) => ({
        name: v,
        color: state.colors.get(v),
        values: durations.map((d) => {
          const slot = state.aggregate.get(d)?.get(v);
          if (!slot) return null;
          if (metric === "p50") return median(slot.p50);
          if (metric === "rtfx") return median(slot.rtfx);
          if (metric === "speed") return median(slot.speed);
          return null;
        })
      }));
    }

    function drawChart(canvasId, title, ylabel, durations, sers, yfmt) {
      const c = document.getElementById(canvasId);
      const ctx = c.getContext("2d");
      const W = c.width, H = c.height;
      const m = { top: 30, right: 16, bottom: 38, left: 68 };
      const pw = W - m.left - m.right;
      const ph = H - m.top - m.bottom;

      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, W, H);

      const values = sers.flatMap((s) => s.values.filter((v) => Number.isFinite(v)));
      if (!durations.length || !values.length) {
        ctx.fillStyle = "#6b7280";
        ctx.font = "14px Segoe UI";
        ctx.fillText("No data in selected range", m.left, m.top + 20);
        return;
      }

      let ymin = Math.min(...values);
      let ymax = Math.max(...values);
      if (ymin === ymax) {
        ymin *= 0.9;
        ymax *= 1.1;
      } else {
        const pad = (ymax - ymin) * 0.12;
        ymin = Math.max(0, ymin - pad);
        ymax += pad;
      }

      const xOf = (i) => m.left + (i / Math.max(1, durations.length - 1)) * pw;
      const yOf = (v) => m.top + ((ymax - v) / (ymax - ymin)) * ph;

      ctx.strokeStyle = "#e5e7eb";
      for (let i = 0; i <= 5; i++) {
        const y = m.top + (i / 5) * ph;
        ctx.beginPath(); ctx.moveTo(m.left, y); ctx.lineTo(m.left + pw, y); ctx.stroke();
      }

      ctx.strokeStyle = "#374151";
      ctx.beginPath();
      ctx.moveTo(m.left, m.top);
      ctx.lineTo(m.left, m.top + ph);
      ctx.lineTo(m.left + pw, m.top + ph);
      ctx.stroke();

      ctx.fillStyle = "#111827";
      ctx.font = "600 14px Segoe UI";
      ctx.fillText(title, m.left, 20);
      ctx.fillStyle = "#374151";
      ctx.font = "12px Segoe UI";
      ctx.fillText(ylabel, 10, m.top - 8);

      for (let i = 0; i <= 5; i++) {
        const val = ymax - (i / 5) * (ymax - ymin);
        const y = m.top + (i / 5) * ph;
        ctx.fillStyle = "#6b7280";
        ctx.fillText(yfmt(val), 8, y + 4);
      }

      durations.forEach((d, i) => {
        const x = xOf(i);
        const label = fsec(d);
        ctx.fillStyle = "#4b5563";
        ctx.font = "11px Segoe UI";
        ctx.fillText(label, x - Math.max(8, label.length * 2), m.top + ph + 15);
      });

      for (const s of sers) {
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        let started = false;
        s.values.forEach((v, i) => {
          if (!Number.isFinite(v)) return;
          const x = xOf(i), y = yOf(v);
          if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
        });
        ctx.stroke();
        s.values.forEach((v, i) => {
          if (!Number.isFinite(v)) return;
          const x = xOf(i), y = yOf(v);
          ctx.fillStyle = s.color;
          ctx.beginPath();
          ctx.arc(x, y, 2.8, 0, Math.PI * 2);
          ctx.fill();
        });
      }
    }

    function renderLegend(id) {
      const el = document.getElementById(id);
      el.innerHTML = state.variants
        .map((v) => `<span><span class="dot" style="background:${state.colors.get(v)}"></span>${v}</span>`)
        .join(" ");
    }

    function renderSummary(durations) {
      const table = document.getElementById("summary");
      const rows = [];
      for (const v of state.variants) {
        const p50 = [], rtfx = [], speed = [];
        let wins = 0;

        for (const d of durations) {
          const slot = state.aggregate.get(d)?.get(v);
          if (!slot) continue;
          const p = median(slot.p50);
          const r = median(slot.rtfx);
          const s = median(slot.speed);
          if (p != null) p50.push(p);
          if (r != null) rtfx.push(r);
          if (s != null) speed.push(s);
        }

        for (const d of durations) {
          let best = null;
          let bestP = Number.POSITIVE_INFINITY;
          for (const vv of state.variants) {
            const p = median(state.aggregate.get(d)?.get(vv)?.p50 || []);
            if (p != null && p < bestP) { bestP = p; best = vv; }
          }
          if (best === v) wins++;
        }

        rows.push({
          variant: v,
          avgP50: avg(p50),
          medRTFx: median(rtfx),
          geoSpeed: gmean(speed),
          wins,
          points: p50.length
        });
      }

      rows.sort((a, b) => (b.geoSpeed || 0) - (a.geoSpeed || 0));
      const best = rows[0]?.variant;
      table.innerHTML =
        `<thead><tr><th>Variant</th><th>Avg p50 (ms)</th><th>Median RTFx</th><th>Geo Speedup</th><th>Duration Wins</th><th>Points</th></tr></thead>` +
        `<tbody>` +
        rows.map((r) =>
          `<tr class="${r.variant === best ? "best" : ""}">` +
          `<td>${r.variant}${r.variant === best ? " (best in range)" : ""}</td>` +
          `<td>${fms(r.avgP50)}</td>` +
          `<td>${fx(r.medRTFx)}</td>` +
          `<td>${fx(r.geoSpeed)}</td>` +
          `<td>${r.wins}</td>` +
          `<td>${r.points}</td>` +
          `</tr>`
        ).join("") +
        `</tbody>`;
    }

    function renderDetail(durations) {
      const table = document.getElementById("detail");
      const header = state.variants.map((v) => `<th>${v} p50</th><th>${v} RTFx</th><th>${v} speed</th>`).join("");
      const rows = durations.map((d) => {
        let best = null;
        let bestP = Number.POSITIVE_INFINITY;
        for (const v of state.variants) {
          const p = median(state.aggregate.get(d)?.get(v)?.p50 || []);
          if (p != null && p < bestP) { bestP = p; best = v; }
        }
        const cols = state.variants.map((v) => {
          const slot = state.aggregate.get(d)?.get(v);
          const p = slot ? median(slot.p50) : null;
          const r = slot ? median(slot.rtfx) : null;
          const s = slot ? median(slot.speed) : null;
          const cls = v === best ? "best" : "";
          return `<td class="${cls}">${fms(p)}</td><td class="${cls}">${fx(r)}</td><td class="${cls}">${fx(s)}</td>`;
        }).join("");
        return `<tr><td>${fsec(d)}</td>${cols}</tr>`;
      });
      table.innerHTML = `<thead><tr><th>Duration(s)</th>${header}</tr></thead><tbody>${rows.join("")}</tbody>`;
    }

    function renderMeta() {
      const totalSplits = state.reports.reduce((a, r) => a + (Array.isArray(r.bySplit) ? r.bySplit.length : 0), 0);
      document.getElementById("meta").textContent =
        `Reports: ${state.reports.length}, durations: ${state.durations.length}, variants: ${state.variants.join(", ")}, split records: ${totalSplits}.`;
    }

    function render() {
      const durations = filteredDurations();
      renderLegend("legend1");
      renderLegend("legend2");
      renderLegend("legend3");
      drawChart("c1", "p50 Latency vs Duration", "ms", durations, series("p50", durations), (v) => v.toFixed(1));
      drawChart("c2", "RTFx vs Duration", "x", durations, series("rtfx", durations), (v) => v.toFixed(2));
      drawChart("c3", "Speedup vs Current", "x", durations, series("speed", durations), (v) => v.toFixed(2));
      renderSummary(durations);
      renderDetail(durations);
      renderMeta();
    }

    function setReports(reports) {
      state.reports = reports;
      normalize(reports);
      render();
    }

    async function loadDefaultReports() {
      try {
        const manifestRes = await fetch(DEFAULT_MANIFEST_PATH);
        if (manifestRes.ok) {
          const manifest = await manifestRes.json();
          const reports = [];
          for (const entry of manifest.reports || []) {
            try {
              const res = await fetch(`../tmp/${entry.path}`);
              if (res.ok) reports.push(await res.json());
            } catch (_) {
              // ignore broken entries
            }
          }
          if (reports.length) {
            setReports(reports);
            return;
          }
        }
      } catch (_) {
        // fallback to latest
      }

      try {
        const res = await fetch(DEFAULT_LATEST_PATH);
        if (!res.ok) throw new Error(`${res.status}`);
        const json = await res.json();
        setReports([json]);
      } catch (e) {
        document.getElementById("meta").textContent =
          `Could not load manifest/latest JSON. Run benchmark first or load files manually.`;
      }
    }

    async function loadFiles(files) {
      const reports = [];
      for (const f of files) {
        reports.push(JSON.parse(await f.text()));
      }
      setReports(reports);
    }

    document.getElementById("btnLoadLatest").addEventListener("click", loadDefaultReports);
    document.getElementById("btn714").addEventListener("click", () => {
      document.getElementById("minSec").value = "7";
      document.getElementById("maxSec").value = "14";
      render();
    });
    document.getElementById("btnReset").addEventListener("click", () => {
      document.getElementById("minSec").value = "0";
      document.getElementById("maxSec").value = "200";
      render();
    });
    document.getElementById("minSec").addEventListener("input", render);
    document.getElementById("maxSec").addEventListener("input", render);
    document.getElementById("files").addEventListener("change", async (ev) => {
      const files = [...ev.target.files];
      if (!files.length) return;
      await loadFiles(files);
    });

    loadDefaultReports();
  </script>
</body>
</html>
