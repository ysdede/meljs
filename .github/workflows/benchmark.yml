name: Benchmark & Deploy Dashboard

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full benchmark (synthetic audio)
        run: node tests/benchmark_variants.mjs --splits "1,2,6,10,16,24,32,38,50,80,whole"

      - name: Run streaming benchmark (synthetic audio)
        run: node tests/benchmark_variants.mjs --splits "7,8,9,10,11,12,13,14"

      - name: Build static dashboard
        run: node tests/build_static_dashboard.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: benchmark
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
